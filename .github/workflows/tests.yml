name: Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pinned version the dev container bakes, so a file that formats
      # clean locally can never fail here (and vice versa).
      - run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-gh-review-threads.sh
      - run: bash scripts/test-dc-helpers.sh
      - run: node scripts/test-checkout-cleanliness-report.mjs
      - run: node scripts/test-storage-probe-target.mjs
      - run: node scripts/test-collision-discovery.mjs
      - run: node scripts/test-collision-dispatch.mjs
      - run: node scripts/test-review-cycle-retirement.mjs
      - run: node scripts/test-subagent-destroy-boundary.mjs
      - run: node scripts/test-unreviewed-close-carriage.mjs
      - run: node scripts/test-address-review-reconcile.mjs
      - run: node scripts/test-skill-worktree-base-exclude.mjs
      - run: node scripts/test-resolve-tasks-contract.mjs
      - run: node scripts/test-skill-mirror-parity.mjs
      - run: node scripts/test-review-stack-plan.mjs
      - run: node scripts/test-pipelined-batch.mjs
