name: Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pinned version README's "Markdown formatting" section gives every
      # local setup, so a file that formats clean locally can never fail here
      # (and vice versa). Bump the pin here and there together.
      - run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
  # Every bundled helper's contract is bash 3.2 and the runner's bash is newer,
  # so the parse check runs in the official image of the real thing.
  bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD":/w:ro -w /w docker.io/library/bash:3.2 bash scripts/check-bash32-syntax.sh --require 3.2
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-gh-review-threads.sh
      - run: bash scripts/test-dc-helpers.sh
      - run: bash scripts/test-prune-branches.sh
      - run: bash scripts/test-address-review-pr-branch.sh
      - run: bash scripts/test-address-review-record.sh
      - run: bash scripts/test-address-review-ping.sh
      - run: bash scripts/test-address-review-publish.sh
      - run: bash scripts/test-write-tasks-task-numbers.sh
      - run: bash scripts/test-address-tasks-overlap.sh
      - run: bash scripts/test-address-tasks-bootstrap.sh
      - run: bash scripts/test-address-review-ci.sh
      - run: bash scripts/test-rebase-stack.sh
      - run: bash scripts/test-merge-train.sh
      - run: bash scripts/test-address-reviews-targets.sh
      - run: node scripts/test-checkout-cleanliness-report.mjs
      - run: node scripts/test-storage-probe-target.mjs
      - run: node scripts/test-collision-discovery.mjs
      - run: node scripts/test-collision-dispatch.mjs
      - run: node scripts/test-review-cycle-retirement.mjs
      - run: node scripts/test-subagent-destroy-boundary.mjs
      - run: node scripts/test-unreviewed-close-carriage.mjs
      - run: node scripts/test-address-review-reconcile.mjs
      - run: node scripts/test-skill-worktree-base-exclude.mjs
      - run: node scripts/test-resolve-tasks-contract.mjs
      - run: node scripts/test-skill-mirror-parity.mjs
      - run: node scripts/test-skill-bundled-files.mjs
      - run: node scripts/test-batch-overlap.mjs
      - run: node scripts/test-pipelined-batch.mjs
